name: CommunityGlows - Browser Extension

on:
  push:
    branches: [master, develop, "codex/**"]
    paths:
      - "src/**"
      - "manifest*.ts"
      - "vite*.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/browser-extension.yml"
  pull_request:
    branches: [master, develop]
    paths:
      - "src/**"
      - "manifest*.ts"
      - "vite*.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/browser-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.0.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --force
      # The existing quality-checks workflow owns the full TypeScript/Convex gate.
      # This job proves that the independently consumable Chrome artifact builds.
      - run: pnpm build:chrome
      - name: Validate Manifest V3 artifact
        run: node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/chrome/manifest.json','utf8'));if(m.manifest_version!==3||!m.name||!m.version)process.exit(1)"
      - uses: actions/upload-artifact@v7
        with:
          name: communityglows-chrome-unpacked
          path: dist/chrome
          if-no-files-found: error
          retention-days: 14
