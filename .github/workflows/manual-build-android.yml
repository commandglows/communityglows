name: SocialGlowz - Manual Build - Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Android artifact type
        required: true
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: manual-android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Android arm64 APK
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept licenses and configure NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          NDK_VERSION=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.0.0
          cache: pnpm

      - name: Install Rust stable with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Android target
        run: pnpm exec tauri android init --ci

      - name: Fetch runtime secrets
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      - name: Build Android APK
        env:
          VITE_CONVEX_URL: ${{ env.VITE_CONVEX_URL || steps.doppler.outputs.VITE_CONVEX_URL }}
        run: pnpm exec tauri android build --ci --${{ inputs.build_type }} --apk -t aarch64

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: socialglowz-android-${{ inputs.build_type }}-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 7
