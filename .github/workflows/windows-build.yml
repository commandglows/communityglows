name: CommunityGlows - Manual Build - Windows

on:
  workflow_dispatch:

concurrency:
  group: manual-windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Windows installer (MSI + NSIS)
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.0.0
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Convex runtime configuration
        shell: pwsh
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_CONVEX_URL)) {
            throw 'VITE_CONVEX_URL is not configured. Add the GitHub Actions repository secret before building a Windows installer.'
          }

      - name: Build Windows installers
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: pnpm tauri:bundle

      - name: Publish stable Windows test installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'NSIS installer was not generated.'
          }

          $stableInstaller = 'CommunityGlows-Windows-latest.exe'
          Copy-Item $installer.FullName $stableInstaller -Force

          gh release view windows-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest `
              --target $env:GITHUB_SHA `
              --title 'CommunityGlows Windows latest' `
              --notes 'Latest manual Windows test build. This prerelease asset is replaced by each successful manual build.' `
              --prerelease
          }

          gh release edit windows-latest --target $env:GITHUB_SHA
          gh release upload windows-latest $stableInstaller --clobber

          "Stable installer URL: https://github.com/${{ github.repository }}/releases/download/windows-latest/$stableInstaller" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: communityglows-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
