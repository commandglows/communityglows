version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      site-npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/src-tauri/plugins/android-webview"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-plugin-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/src-tauri/gen/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      android-gradle-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
