version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      site-npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/src-tauri/plugins/android-webview"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-plugin-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/src-tauri/gen/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "androidx.webkit:webkit"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "androidx.appcompat:appcompat"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "com.google.android.material:material"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "androidx.test.ext:junit"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "androidx.test.espresso:espresso-core"
        update-types:
          - "version-update:semver-minor"
    groups:
      android-gradle-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
